<g font-family="sans-serif" text-anchor="middle" fill="#a9d2cf" font-size="14"><text x="560" y="211">Rootbound &amp; practice gateways</text><text x="560" y="234">source-bound Enter controls</text><text x="856" y="323">training · Proving Grounds</text><text x="856" y="346">no involuntary PvP</text><text x="952" y="516">three existing NPC merchants</text><text x="952" y="539">validated Depthmark transactions</text><text x="856" y="733">existing Hall portal &amp; exhibits</text><text x="856" y="756">owned inventory references</text><text x="560" y="829">+5 / +10 · repair · crafting</text><text x="560" y="852">0.8 m terrace · broad ramp</text><text x="264" y="733">rotatable appearance preview</text><text x="264" y="756">billing remains gated</text><text x="168" y="516">conservatory &amp; collection guide</text><text x="168" y="539">earned cosmetic pets in 6E</text><text x="264" y="323">existing Guardian &amp; Mystic</text><text x="264" y="346">0.8 m terrace · broad ramp</text></g>
